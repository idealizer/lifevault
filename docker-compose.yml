services:
  web:
    build: .
    restart: unless-stopped
    environment:
      LIFE_HOST: 0.0.0.0
      LIFE_PORT: "8765"
      LIFE_DB: /data/lifevault.db
      LIFE_ACCESS_PASSWORD: hackathon-zh
    volumes:
      - lifevault_data:/data
    expose:
      - "8765"
    labels:
      - traefik.enable=true
      - traefik.http.routers.lifevault-ch.rule=Host(`lifevault.ch`) || Host(`www.lifevault.ch`)
      - traefik.http.routers.lifevault-ch.entrypoints=websecure
      - traefik.http.routers.lifevault-ch.tls.certresolver=letsencrypt
      - traefik.http.services.lifevault-ch.loadbalancer.server.port=8765
    networks:
      - idealizer-internal

volumes:
  lifevault_data:

networks:
  idealizer-internal:
    external: true
